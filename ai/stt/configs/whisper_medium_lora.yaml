model:
  id: openai/whisper-medium
  language: ko
  task: transcribe
  max_label_length: 128

data:
  # Upload this archive to Google Drive before running the notebook.
  archive_path: /content/drive/MyDrive/MazuTalk/stt_data/mazutalk_stt_data_10k.tar
  runtime_root: /content/mazutalk_stt_data
  child_metadata: ai/data/processed/stt/metadata_preprocessed.csv
  asd_metadata: ai/stt/data/processed/asd_metadata.csv
  sample_rate: 16000
  max_audio_seconds: 30.0
  child_train_limit: 5000
  child_eval_limit: 300
  child_retention_samples: 256

split:
  seed: 42
  validation_ratio: 0.05
  test_ratio: 0.05

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  output_dir: /content/drive/MyDrive/MazuTalk/checkpoints/whisper-medium-child-lora
  train_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  max_steps: 500
  warmup_steps: 50
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  generation_max_length: 128
  fp16: true

asd_adaptation:
  enabled: true
  train_files:
    - ASD_S001_U001.wav
    - ASD_S001_U002.wav
    - ASD_S001_U004.wav
    - ASD_S001_U005.wav
    - ASD_S001_U006.wav
  test_files:
    - ASD_S001_U003.wav
    - ASD_S001_U007.wav
  repeat_factor: 20
  learning_rate: 0.00001
  max_steps: 50
  warmup_steps: 5

prompt:
  text: 사과, 빨갛다, 비가 온다, 꽃이 예쁘다, 옥수수, 아빠, 기린, 일, 이, 삼.
  num_beams: 5
