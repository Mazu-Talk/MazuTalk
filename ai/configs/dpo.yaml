# 소규모 DPO 하이퍼파라미터 (계획서 §Phase 4).
# 시작점 = SFT 어댑터, reference = 학습 전 SFT 가중치(DPOTrainer 기본).

output_dir: "ai/models/dpo"
seed: 42

beta: 0.05
learning_rate: 5.0e-6
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_prompt_length: 1024
max_length: 2048
warmup_ratio: 0.05
lr_scheduler_type: "cosine"
optim: "paged_adamw_8bit"
logging_steps: 10
save_strategy: "epoch"
bf16: true                  # L4/A100: bf16 학습 (GradScaler 미사용 → unscale 오류 없음). T4면 false+fp16:true
fp16: false

# LoRA (SFT 와 동일 rank 유지)
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
