name: mazutalk

services:
  frontend:
    build: ./frontend
    container_name: MazuTalk-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      # 표정 모델(ai/models 단일 출처)을 프론트 dev 서버가 /best.onnx 로 서빙하도록 마운트.
      # 컨테이너 빌드 컨텍스트(./frontend)엔 ai/models 가 없으므로 바인드 마운트로 연결한다.
      - ./ai/models/best.onnx:/app/public/best.onnx:ro

  backend:
    build: ./backend
    container_name: MazuTalk-backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      # LLM (Ollama 사이드카)
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-mazutalk}
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-120}
      RP_PROMPT_PATH: ${RP_PROMPT_PATH:-/app/ai_prompts/RP_system_prompt_runtime.md}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SESSION_DB_PATH: ${SESSION_DB_PATH:-:memory:}
      STT_MODEL: ${STT_MODEL:-/app/models/stt}
      STT_FALLBACK_MODEL: ${STT_FALLBACK_MODEL:-medium}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-3}
      TTS_DEVICE: ${TTS_DEVICE:-auto}
      TTS_OUTPUT_DIR: ${TTS_OUTPUT_DIR:-/app/output_audio}
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    volumes:
      - ${STT_MODEL_HOST_PATH:-./ai/stt/models/faster-whisper-medium-child-lora-int8}:/app/models/stt:ro
      # RP 시스템 프롬프트 단일 출처(ai/prompts)를 읽기 전용으로 마운트
      - ./ai/prompts:/app/ai_prompts:ro

  ollama:
    image: ollama/ollama:latest
    container_name: MazuTalk-ollama
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    ports:
      # 호스트 포트는 네이티브 Ollama(11434)와 충돌을 피해 11435로 매핑.
      # 백엔드는 내부 네트워크(ollama:11434)로 접속하므로 영향 없음.
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
      # ai/models 디렉토리 마운트(GGUF 부재 시에도 빈 파일 생성 안 되도록 dir 마운트).
      # Modelfile 은 /models/model-q4_k_m.gguf 를 참조.
      - ./ai/models:/models:ro
      - ./ollama/Modelfile:/modelfile/Modelfile:ro
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro

volumes:
  ollama_data:
